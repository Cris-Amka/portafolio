<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Piedra, papel y tijeras</title>
    <link rel="stylesheet" href="../css/juego.css">
    <script src="../js/juego.js" defer></script>
</head>

<body>
    <main> 
        <h1>Piedra, papel y tijeras</h1>
        <p class="instrucciones">Elige una opción y juega contra la máquina</p>
        
        <div class="opciones">
            <button type="button" onclick="juego('piedra')">Piedra</button>
            <button type="button" onclick="juego('papel')">Papel</button>
            <button type="button" onclick="juego('tijera')">Tijera</button>
        </div>

        <section id="resultado">
            <h2>Resultado</h2>
            <p id="jugada-jugador"></p>
            <p id="jugada-maquina"></p>
            <p id="mensaje"></p>
        </section>

        <section id="marcador-seccion">
            <p id="marcador">Partidas jugadas: 0</p>
            <p id="ganadas">Ganadas: 0</p>
            <p id="empatadas">Empatadas: 0</p>
            <p id="perdidas">Derrotas: 0</p>
        </section>
        
        <button type="button" class="btn-reiniciar" onclick="reiniciar()">Reiniciar Partidas</button>
    </main>
</body>
</html>
